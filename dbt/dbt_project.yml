name: 'sales_analytics'
version: '1.0.0'
config-version: 2

profile: 'sales_db'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  sales_analytics:
    staging:
      # Task doesn't call staging out as a table or view explicitly, but
      # staging exists purely to clean/cast raw data cheaply - a view is
      # the right default so it always reflects the current raw data.
      +materialized: view
      +schema: staging
    marts:
      # Task explicitly says "create at least three tables" for the
      # Customer/Order/OrderItem/Product layer.
      +materialized: table
      +schema: marts
